  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    .page-hero {
      padding: 6rem 0 5rem;
      border-bottom: 1px solid var(--line-subtle);
    }

    .page-hero__label {
      font-family: "Space Mono", monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 1rem;
      display: block;
    }

    .page-hero h1 {
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      line-height: 1.06;
      margin-bottom: 1.5rem;
    }

    .page-hero h1 em {
      font-style: normal;
      color: rgba(255,255,255,0.45);
    }

    .page-hero__sub {
      font-size: 1.1rem;
      color: var(--muted);
      max-width: 560px;
      line-height: 1.75;
    }

    .gallery-section {
      padding: 4rem 0 5rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-flow: dense;
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-top: 2rem;
    }

    .photo-button {
      display: block;
      width: 100%;
      border: 0;
      padding: 0;
      background: var(--bg-elevated);
      cursor: zoom-in;
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .photo-button--wide {
      aspect-ratio: 16 / 10;
      grid-column: span 2;
    }

    .photo-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(0.2) contrast(0.95);
      opacity: 0.82;
      transition: transform 0.5s var(--ease), opacity 0.25s ease, filter 0.25s ease;
    }

    .photo-button:hover img {
      transform: scale(1.035);
      opacity: 1;
      filter: grayscale(0) contrast(1);
    }

    @media (max-width: 900px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 520px) {
      .photo-grid { grid-template-columns: 1fr; }
      .photo-button--wide { grid-column: span 1; }
    }
  </style>
</head>
